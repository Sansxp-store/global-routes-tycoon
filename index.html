<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✈</div><div><div class="brand-name">GLOBAL ROUTES</div><div class="brand-sub">TRANSPORT TYCOON</div></div></div>
    <div class="progress-cluster">
      <div class="level"><div class="level-line"><span>♟</span> CEO LVL <b id="ceo-level">1</b></div><div class="bar"><i id="ceo-progress"></i></div><div class="level-line" style="margin-top:6px"><span style="color:var(--gold)">★</span> COMPANY LVL <b id="company-level">1</b></div><div class="bar"><i id="company-progress" style="background:linear-gradient(90deg,#efc544,#ffe99a)"></i></div></div>
      <div class="cash-box"><div class="cash-symbol">$</div><div class="cash-value" id="cash">118</div></div>
    </div>
    <div class="top-actions"><button class="icon-button" data-action="settings" title="Pengaturan">⚙</button><button class="icon-button" data-action="help" title="Petunjuk">?</button></div>
  </header>
  <main class="game-layout">
    <section class="map-area" aria-label="Peta rute transportasi">
      <svg class="map-svg" id="world-map" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Peta dunia Global Routes Tycoon">
        <defs>
          <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#27405b" stroke-width=".8"/></pattern>
          <radialGradient id="oceanGlow"><stop offset="0" stop-color="#102a47"/><stop offset="1" stop-color="#061326"/></radialGradient>
        </defs>
        <rect width="1000" height="560" fill="url(#oceanGlow)"/><rect width="1000" height="560" fill="url(#grid)" class="ocean-grid"/>
        <g class="land-shadow" transform="translate(4 6)">
          <path d="M72 100l35-29 66 4 31 24 53 3 42 35-13 31-39 8-16 34-33 17-20 49-35-3-17-34-42-11-24-32-38-9-13-39z"/>
          <path d="M260 295l34 11 20 43-13 42-14 50-22 45-22-22-7-57-20-42 10-42z"/>
          <path d="M462 113l31-20 45 3 22 18 61-4 30 22 50-2 41 29-12 29-40 7-23 33-35 8-6 33-37 13-22-19-30 8-26-20-33 1-13-26-29-3-16-42z"/>
          <path d="M536 264l46-11 45 21 26 40-18 57-25 67-32 39-25-27-15-56-24-43-5-52z"/>
          <path d="M742 174l44-20 67 18 24 34-16 29-45 4-25-21-29 6-28-24z"/>
          <path d="M864 285l30-11 31 22-9 28-31 10-26-19z"/>
        </g>
        <g class="land">
          <path d="M72 100l35-29 66 4 31 24 53 3 42 35-13 31-39 8-16 34-33 17-20 49-35-3-17-34-42-11-24-32-38-9-13-39z"/>
          <path d="M260 295l34 11 20 43-13 42-14 50-22 45-22-22-7-57-20-42 10-42z"/>
          <path d="M462 113l31-20 45 3 22 18 61-4 30 22 50-2 41 29-12 29-40 7-23 33-35 8-6 33-37 13-22-19-30 8-26-20-33 1-13-26-29-3-16-42z"/>
          <path d="M536 264l46-11 45 21 26 40-18 57-25 67-32 39-25-27-15-56-24-43-5-52z"/>
          <path d="M742 174l44-20 67 18 24 34-16 29-45 4-25-21-29 6-28-24z"/>
          <path d="M864 285l30-11 31 22-9 28-31 10-26-19z"/>
        </g>
        <g id="routes-layer"></g><g id="cities-layer"></g><g id="vehicles-layer"></g>
      </svg>
      <div class="map-vignette"></div>
      <div class="left-hud">
        <div class="hud-pill"><span class="ico green">✈</span><span id="plane-count">1/10</span></div>
        <div class="hud-pill"><span class="ico blue">♧</span><span id="boat-count">0/5</span></div>
        <div class="hud-pill"><span class="ico">♟</span><span id="passenger-count">0</span></div>
        <div class="hud-pill gold"><span class="ico gold">$</span><span class="value" id="income-rate">+$6/s</span></div>
      </div>
      <div class="map-controls"><button class="map-control" data-action="bonus" title="Bonus harian">$</button><button class="map-control" data-action="mapview" title="Pusatkan peta">▱</button><button class="map-control secondary" data-action="settings" title="Pengaturan">⚙</button></div>
      <div class="map-legend"><span><i class="legend-dot" style="background:#bd43ff"></i>Rute udara</span><span><i class="legend-dot" style="background:#ec9b32"></i>Rute laut</span><span><i class="legend-dot" style="background:#53b8ee"></i>Kota aktif</span></div>
      <div class="map-toast" id="map-toast">Rute berhasil diperbarui</div>
    </section>
    <aside class="sidebar">
      <nav class="main-tabs" id="main-tabs">
        <button class="main-tab active" data-tab="air"><span class="tab-ico">✈</span>AIRLINES</button>
        <button class="main-tab" data-tab="boats"><span class="tab-ico">♧</span>SHIPPING</button>
        <button class="main-tab" data-tab="revenue"><span class="tab-ico">＄</span>REVENUE</button>
      </nav>
      <nav class="sub-tabs" id="sub-tabs"></nav>
      <div class="panel-scroll" id="panel-content"></div>
    </aside>
  </main>
</div>
<div id="modal-root"></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const SAVE_KEY='globalRoutesTycoon_v1';
const CITY_DATA=[
 {id:'la',name:'Los Angeles',x:142,y:223,price:6500,pop:42,region:'North America'},
 {id:'ny',name:'New York',x:330,y:212,price:0,pop:50,region:'North America'},
 {id:'mex',name:'Mexico City',x:276,y:330,price:8500,pop:38,region:'North America'},
 {id:'lon',name:'London',x:536,y:168,price:0,pop:50,region:'Europe'},
 {id:'par',name:'Paris',x:559,y:212,price:10500,pop:46,region:'Europe'},
 {id:'mad',name:'Madrid',x:526,y:258,price:12500,pop:44,region:'Europe'},
 {id:'ber',name:'Berlin',x:601,y:174,price:16000,pop:48,region:'Europe'},
 {id:'rom',name:'Rome',x:590,y:245,price:19000,pop:43,region:'Europe'},
 {id:'ist',name:'Istanbul',x:665,y:223,price:24000,pop:45,region:'Europe / Asia'},
 {id:'cai',name:'Cairo',x:660,y:310,price:28500,pop:40,region:'Africa'}
];
const PLANE_MODELS=[
 {name:'SKY-BREEZE 200',price:3900,capacity:20,speed:24,ticket:10,desc:'Pesawat regional · Ekonomis'},
 {name:'VELOCITY-JET 50',price:18000,capacity:50,speed:32,ticket:18,desc:'Jet jarak menengah · Cepat'},
 {name:'AURORA LINER 90',price:52000,capacity:90,speed:39,ticket:27,desc:'Pesawat jarak jauh · Premium'},
 {name:'TITAN AIR 160',price:135000,capacity:160,speed:45,ticket:38,desc:'Kapasitas besar · Antarbenua'}
];
const BOAT_MODELS=[
 {name:'HARBOR SPRINTER',price:5200,capacity:35,speed:13,ticket:8,desc:'Kapal cepat · Rute pesisir'},
 {name:'OCEAN CARRIER',price:22000,capacity:100,speed:17,ticket:14,desc:'Kapal penumpang · Lintas laut'},
 {name:'BLUE HORIZON',price:68000,capacity:220,speed:20,ticket:22,desc:'Kapal samudra · Kapasitas besar'}
];
const fmt=n=>'$'+Math.floor(Math.max(0,n)).toLocaleString('en-US');
const short=n=>{n=Math.floor(n);if(n>=1e9)return '$'+(n/1e9).toFixed(1)+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(1)+'M';if(n>=1e4)return '$'+(n/1e3).toFixed(1)+'K';return '$'+n.toLocaleString('en-US')};
const clone=o=>JSON.parse(JSON.stringify(o));
const defaults=()=>({cash:118,totalEarned:0,lastSavedAt:Date.now(),ceoXp:0,companyXp:0,ceoLevel:1,companyLevel:1,companyBoost:1,passengers:0,totalPassengers:0,airports:['ny','lon'],airportStats:{ny:{capacity:50,arrivals:1,ticket:1,manager:false,lounge:0},lon:{capacity:50,arrivals:1,ticket:1,manager:false,lounge:0}},planes:[{id:1,name:PLANE_MODELS[0].name,model:0,capacity:20,speed:24,ticket:10,color:'#bd43ff',from:'ny',to:'lon',progress:0}],boats:[],nextId:2,selectedCity:null,cityTab:'planes',mainTab:'air',subTab:'fleet',routesVisible:true,bonusTaken:false,lastBonusDay:'',history:Array(12).fill(6),settings:{compact:false}});
let state=defaults();let offlineGain=0;
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const x=JSON.parse(raw);state={...defaults(),...x};state.airportStats={...defaults().airportStats,...x.airportStats};state.history=Array.isArray(x.history)?x.history:Array(12).fill(0);const elapsed=Math.max(0,Math.min(8*60*60,Math.floor((Date.now()-(x.lastSavedAt||Date.now()))/1000)));offlineGain=income()*elapsed;if(offlineGain>0)earn(offlineGain);state.lastSavedAt=Date.now()}}catch(e){console.warn('Save tidak terbaca',e)}}
function save(){try{state.lastSavedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
const city=id=>CITY_DATA.find(c=>c.id===id);
const airport=id=>state.airportStats[id]||(state.airportStats[id]={capacity:50,arrivals:1,ticket:1,manager:false,lounge:0});
const allVehicles=()=>[...state.planes.map(p=>({...p,type:'air'})),...state.boats.map(b=>({...b,type:'boat'}))];
function routeIncome(v){if(!v.from||!v.to||!state.airports.includes(v.from)||!state.airports.includes(v.to))return 0;const a=city(v.from),b=city(v.to);const dist=Math.hypot(a.x-b.x,a.y-b.y);const travel=Math.max(18,dist/(v.speed*.9));const statsA=airport(v.from),statsB=airport(v.to);const local=(statsA.arrivals+statsB.arrivals)/2;const lounge=1+(statsA.lounge+statsB.lounge)*.08;const managers=(statsA.manager?1.18:1)*(statsB.manager?1.18:1);const ticketBoost=(statsA.ticket+statsB.ticket)/2;const rate=v.type==='boat'?.012:.03;return v.capacity*v.ticket*rate*(v.speed/24)*(0.82+local*.18)*ticketBoost*lounge*managers*state.companyBoost;}
function income(){return allVehicles().reduce((s,v)=>s+routeIncome(v),0)}
function openCity(id){state.selectedCity=id;state.cityTab='planes';state.mainTab='air';state.subTab='fleet';renderAll()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function mapToast(msg){const el=document.getElementById('map-toast');el.textContent=msg;el.classList.add('show');clearTimeout(mapToast.timer);mapToast.timer=setTimeout(()=>el.classList.remove('show'),1600)}
function spend(amount){if(state.cash<amount){toast('Uang belum cukup. Kembangkan pendapatan dahulu.');return false}state.cash-=amount;return true}
function earn(amount){state.cash+=amount;state.totalEarned+=amount;state.ceoXp+=amount*.05;state.companyXp+=amount*.15;}
function updateLevels(){let newCeo=1+Math.floor(state.ceoXp/3500);if(newCeo>state.ceoLevel){state.ceoLevel=newCeo;toast('Level CEO naik ke '+newCeo+'!')}}
function setMain(tab){state.mainTab=tab;state.selectedCity=null;if(tab==='revenue')state.subTab='analytics';else state.subTab=tab==='boats'?'fleet':'fleet';renderAll()}
function setSub(sub){state.subTab=sub;renderAll()}
function buyPlane(idx){const m=PLANE_MODELS[idx];if(state.planes.length>=10){toast('Armada pesawat sudah mencapai batas 10.');return}if(!spend(m.price))return;const id=state.nextId++;state.planes.push({id,name:m.name,model:idx,capacity:m.capacity,speed:m.speed,ticket:m.ticket,color:['#bd43ff','#43b9ff','#f3c735','#35d5a0'][idx%4],from:null,to:null,progress:0});state.mainTab='air';state.subTab='fleet';renderAll();toast('Pesawat baru dibeli. Tentukan rutenya!')}
function buyBoat(idx){const m=BOAT_MODELS[idx];if(state.boats.length>=5){toast('Armada kapal sudah mencapai batas 5.');return}if(!spend(m.price))return;const id=state.nextId++;state.boats.push({id,name:m.name,model:idx,capacity:m.capacity,speed:m.speed,ticket:m.ticket,color:'#ee9b35',from:null,to:null,progress:0});state.mainTab='boats';state.subTab='fleet';renderAll();toast('Kapal baru dibeli. Tentukan rutenya!')}
function buyUpgrade(type,id,key){const arr=type==='air'?state.planes:state.boats;const v=arr.find(x=>x.id===id);if(!v)return;const config={capacity:{amount:type==='air'?4:8,cost:Math.round(320+v.capacity*2.35),label:'Kapasitas'},ticket:{amount:type==='air'?.8:1,cost:Math.round(250+v.ticket*2.5),label:'Harga tiket'},speed:{amount:type==='air'?.6:.45,cost:Math.round(150+v.speed*8),label:'Kecepatan'}}[key];if(!spend(config.cost))return;v[key]+=config.amount;renderAll();toast(config.label+' armada ditingkatkan.')}
function unlockCity(id){const c=city(id);if(state.airports.includes(id)){openCity(id);return}if(!spend(c.price))return;state.airports.push(id);airport(id);state.companyXp+=600;state.selectedCity=id;renderAll();mapToast(c.name+' sekarang menjadi hub aktif!');}
function upgradeAirport(id,key){const a=airport(id);const cfg={capacity:{cost:Math.round(616+(a.capacity-50)*18),inc:5,label:'Kapasitas bandara'},arrivals:{cost:Math.round(616+(a.arrivals-1)*900),inc:.1,label:'Arus kedatangan'},ticket:{cost:Math.round(734+(a.ticket-1)*900),inc:.1,label:'Harga tiket'}}[key];if(!spend(cfg.cost))return;a[key]+=cfg.inc;renderAll();toast(cfg.label+' ditingkatkan.')}
function hireManager(id){const a=airport(id);if(a.manager){toast('Manajer sudah bekerja di kota ini.');return}if(!spend(10200))return;a.manager=true;renderAll();toast('Manajer '+city(id).name+' berhasil direkrut!')}
function buyLounge(id){const a=airport(id);if(a.lounge>=3){toast('Lounge mencapai level maksimum.');return}const cost=2800*(a.lounge+1);if(!spend(cost))return;a.lounge++;renderAll();toast('Fasilitas lounge ditingkatkan.')}
function assignRoute(type,id,from,to){if(from===to){toast('Pilih dua kota yang berbeda.');return}if(!state.airports.includes(from)||!state.airports.includes(to)){toast('Kedua kota harus memiliki bandara aktif.');return}const arr=type==='air'?state.planes:state.boats;const v=arr.find(x=>x.id===id);if(!v)return;v.from=from;v.to=to;v.progress=0;renderAll();mapToast('Rute '+city(from).name+' – '+city(to).name+' aktif!')}
function takeBonus(){const today=new Date().toISOString().slice(0,10);if(state.lastBonusDay===today){toast('Bonus harian sudah diambil. Kembali besok!');return}const reward=250+state.companyLevel*75;earn(reward);state.lastBonusDay=today;state.bonusTaken=true;updateLevels();updateHud();save();toast('Bonus harian diterima: '+fmt(reward))}
function confirmReset(){showModal('Mulai ulang permainan?','Semua uang, armada, kota, dan progres akan dihapus. Tindakan ini tidak dapat dibatalkan.',[{label:'Batal',cls:'btn-muted',act:closeModal},{label:'Reset permainan',cls:'btn-gold',act:()=>{state=defaults();save();closeModal();renderAll();toast('Permainan dimulai ulang.')}}])}
function showModal(title,copy,buttons){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal"><h3>${title}</h3><p>${copy}</p><div class="modal-actions">${buttons.map((b,i)=>`<button class="action-button ${b.cls||''}" data-modal-btn="${i}">${b.label}</button>`).join('')}</div></div></div>`;root._buttons=buttons;root.querySelectorAll('[data-modal-btn]').forEach(el=>el.addEventListener('click',()=>root._buttons[+el.dataset.modalBtn].act()))}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function help(){showModal('Cara bermain','Bangun jaringan transportasi global. Kota yang aktif dapat dihubungkan dengan pesawat atau kapal. Setiap rute menghasilkan pendapatan otomatis. Gunakan uang untuk membeli armada, menaikkan kapasitas, kecepatan, dan harga tiket. Rekrut manajer serta bangun lounge untuk meningkatkan pemasukan. Klik titik kota pada peta untuk melihat permintaan penumpang dan mengatur rute.',[{label:'Mengerti',cls:'btn-gold',act:closeModal}])}
function settings(){showModal('Pengaturan permainan','Progress tersimpan otomatis di perangkat ini. Game berjalan offline dan tidak memerlukan akun.',[{label:'Tutup',cls:'btn-muted',act:closeModal},{label:'Kebijakan Privasi',cls:'btn-blue',act:privacy},{label:'Reset progress',cls:'btn-gold',act:()=>{closeModal();confirmReset()}}])}
function privacy(){showModal('Kebijakan Privasi','<strong>Informasi pribadi:</strong> Game ini tidak meminta nama, nomor telepon, kontak, lokasi, foto, atau akun pengguna.<br><br><strong>Progres permainan:</strong> Saldo, armada, rute, dan progres disimpan secara lokal di perangkat agar permainan dapat dilanjutkan. Data tidak dikirim ke server, tidak disinkronkan ke cloud, dan tidak dibagikan kepada pihak lain.<br><br><strong>Iklan dan pelacakan:</strong> Versi ini tidak menggunakan iklan, analitik, atau pelacak pihak ketiga.<br><br><strong>Izin dan koneksi:</strong> Game berjalan offline dan tidak meminta izin sensitif perangkat.<br><br><strong>Penghapusan:</strong> Gunakan Reset progress di Pengaturan atau hapus data aplikasi untuk menghapus progres lokal.<br><br><strong>Kontak:</strong> Untuk pertanyaan privasi, hubungi developer melalui email yang tercantum pada halaman Google Play aplikasi.',[{label:'Tutup',cls:'btn-gold',act:closeModal}])}
function vehicleRouteSelect(v,type){const open=state.airports;return `<div class="route-select"><select id="from-${type}-${v.id}" aria-label="Kota asal">${open.map(id=>`<option value="${id}" ${v.from===id?'selected':''}>${city(id).name}</option>`).join('')}</select><span class="muted">→</span><select id="to-${type}-${v.id}" aria-label="Kota tujuan">${open.filter(id=>id!==(v.from||open[0])).map(id=>`<option value="${id}" ${v.to===id?'selected':''}>${city(id).name}</option>`).join('')}</select><button class="small-action" data-action="assign" data-type="${type}" data-id="${v.id}">SIMPAN</button></div>`}
function vehicleCard(v,type){const route=v.from&&v.to?`${city(v.from).name} → ${city(v.to).name}`:'Belum ada rute';const col=type==='air'?'purple':'gold';return `<div class="card"><div class="card-head"><div class="card-title"><div class="card-icon" style="color:${v.color}">${type==='air'?'✈':'♧'}</div><div><div>${v.name}</div><div class="card-sub">${route}</div></div></div><span class="owned-tag">OWNED #${v.id}</span></div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Capacity</div><div class="stat-value">${v.capacity} <small class="muted">👥</small></div><button class="upgrade-button" style="margin-top:8px;width:100%" data-action="upgrade" data-type="${type}" data-id="${v.id}" data-key="capacity">+${type==='air'?4:8} · ${fmt(Math.round(320+v.capacity*2.35))}</button></div><div class="stat-box"><div class="stat-label">Ticket price</div><div class="stat-value">${fmt(v.ticket)}</div><button class="upgrade-button" style="margin-top:8px;width:100%" data-action="upgrade" data-type="${type}" data-id="${v.id}" data-key="ticket">+${type==='air'?'0.8':'1'} · ${fmt(Math.round(250+v.ticket*2.5))}</button></div><div class="stat-box"><div class="stat-label">Speed</div><div class="stat-value">${v.speed.toFixed(1)}</div><button class="upgrade-button" style="margin-top:8px;width:100%" data-action="upgrade" data-type="${type}" data-id="${v.id}" data-key="speed">+${type==='air'?'0.6':'0.45'} · ${fmt(Math.round(150+v.speed*8))}</button></div></div>${vehicleRouteSelect(v,type)}<div class="card-sub" style="margin-top:9px">Pendapatan estimasi: <b class="green">${fmt(routeIncome({...v,type}))}/detik</b></div></div>`}
function renderFleet(type){const arr=type==='air'?state.planes:state.boats;const models=type==='air'?PLANE_MODELS:BOAT_MODELS;let html=`<div class="section-heading"><h2>${type==='air'?'AIRCRAFT FLEET':'SHIPPING FLEET'}</h2><span class="eyebrow">${arr.length}/${type==='air'?10:5} ACTIVE</span></div>`;if(!arr.length)html+=`<div class="empty-state"><div class="empty-icon">${type==='air'?'✈':'♧'}</div>Belum ada armada. Beli kendaraan pertama untuk membuka rute dan mulai menghasilkan pendapatan.</div>`;arr.forEach(v=>html+=vehicleCard(v,type));html+=`<div class="section-heading" style="margin-top:17px"><h2>${type==='air'?'BUY AIRCRAFT':'BUY SHIPS'}</h2><span class="eyebrow">AVAILABLE MODELS</span></div>`;models.forEach((m,i)=>{const owned=arr.filter(v=>v.model===i).length;html+=`<div class="buy-card"><div class="buy-icon ${type==='air'?'purple':'gold'}">${type==='air'?'✈':'♧'}</div><div class="buy-info"><div class="buy-name">${m.name}</div><div class="buy-desc">${m.desc} · Kapasitas ${m.capacity}</div></div><div class="buy-price">${short(m.price)}</div><button class="buy-button ${state.cash>=m.price?'affordable':''}" data-action="buy-${type}" data-index="${i}" ${state.cash<m.price||arr.length>=(type==='air'?10:5)?'disabled':''}>${owned?'BUY +':'BUY'}</button></div>`});return html}
function renderAirports(){let html=`<div class="section-heading"><h2>AIRPORT NETWORK</h2><span class="eyebrow">${state.airports.length} / ${CITY_DATA.length} HUBS</span></div><div class="notice">Upgrade bandara untuk meningkatkan arus penumpang, kapasitas terminal, dan pendapatan tiket.</div>`;state.airports.forEach(id=>{const c=city(id),a=airport(id);html+=`<div class="card"><div class="card-head"><div class="card-title"><div class="card-icon" style="color:var(--green)">▰</div><div><div>${c.name}</div><div class="card-sub">${c.region} · Bandara aktif</div></div></div><span class="owned-tag">✓ OPEN</span></div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Capacity</div><div class="stat-value">${a.capacity}</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="capacity">+5 · ${fmt(616+(a.capacity-50)*18)}</button></div><div class="stat-box"><div class="stat-label">Arrivals</div><div class="stat-value">${a.arrivals.toFixed(1)}x</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="arrivals">+0.1x · ${fmt(616+(a.arrivals-1)*900)}</button></div><div class="stat-box"><div class="stat-label">Ticket price</div><div class="stat-value">${a.ticket.toFixed(1)}x</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="ticket">+0.1x · ${fmt(734+(a.ticket-1)*900)}</button></div></div></div>`});html+=`<div class="section-heading" style="margin-top:17px"><h2>EXPAND TO NEW CITIES</h2></div>`;CITY_DATA.filter(c=>!state.airports.includes(c.id)).forEach(c=>{html+=`<div class="buy-card"><div class="buy-icon blue">⌖</div><div class="buy-info"><div class="buy-name">${c.name}</div><div class="buy-desc">${c.region} · Demand ${c.pop} passengers</div></div><div class="buy-price">${short(c.price)}</div><button class="buy-button ${state.cash>=c.price?'affordable':''}" data-action="unlock" data-id="${c.id}" ${state.cash<c.price?'disabled':''}>UNLOCK</button></div>`});return html}
function renderManagers(){let html=`<div class="section-heading"><h2>MANAGEMENT TEAM</h2><span class="eyebrow">CITY OPERATIONS</span></div><div class="notice">Manajer mengoptimalkan operasional kota dan meningkatkan pendapatan rute sebesar 18% untuk setiap hub yang dikelola.</div>`;state.airports.forEach(id=>{const a=airport(id);html+=`<div class="buy-card"><div class="buy-icon green">♟</div><div class="buy-info"><div class="buy-name">${city(id).name}</div><div class="buy-desc">${a.manager?'Manajer aktif · Bonus revenue +18%':'Belum memiliki manajer'}</div></div>${a.manager?'<span class="owned-tag">HIRED</span>':`<div class="buy-price">$10.2K</div><button class="buy-button ${state.cash>=10200?'affordable':''}" data-action="hire" data-id="${id}" ${state.cash<10200?'disabled':''}>HIRE</button>`}</div>`});return html}
function renderLounges(){let html=`<div class="section-heading"><h2>VIP LOUNGES</h2><span class="eyebrow">PASSENGER EXPERIENCE</span></div><div class="notice">Lounge meningkatkan kepuasan penumpang dan pendapatan rute. Maksimal 3 level untuk setiap kota.</div>`;state.airports.forEach(id=>{const a=airport(id),cost=2800*(a.lounge+1);html+=`<div class="card"><div class="card-head"><div class="card-title"><div class="card-icon" style="color:var(--gold)">♛</div><div><div>${city(id).name}</div><div class="card-sub">Lounge level ${a.lounge}/3</div></div></div><span class="owned-tag">${a.lounge?'+ '+(a.lounge*8)+'% REVENUE':'NOT BUILT'}</span></div><div class="progress-track"><i style="width:${a.lounge/3*100}%"></i></div><button class="upgrade-button btn-gold" style="width:100%" data-action="lounge" data-id="${id}" ${a.lounge>=3||state.cash<cost?'disabled':''}>${a.lounge>=3?'MAX LEVEL':'UPGRADE LOUNGE · '+fmt(cost)}</button></div>`});return html}
function renderRevenue(){const r=income(),air=state.planes.reduce((s,v)=>s+routeIncome({...v,type:'air'}),0),boats=state.boats.reduce((s,v)=>s+routeIncome({...v,type:'boat'}),0);const lounge=state.airports.reduce((s,id)=>s+airport(id).lounge,0);const max=Math.max(1,...state.history);let bars=state.history.map((v,i)=>`<div class="chart-bar" style="height:${Math.max(5,v/max*100)}%"><span>${i+1}</span></div>`).join('');return `<div class="section-heading"><h2>INCOME ANALYTICS</h2><span class="eyebrow">LIVE · 10S AVG</span></div><div class="analytics-big"><div><div class="eyebrow">TOTAL REVENUE</div><div class="total">${fmt(r)}/s</div></div><div class="rate">+${fmt(r*60)} / menit</div></div><div class="card"><div class="card-head"><div class="card-title">▤ PERFORMANCE BY SOURCE</div><span class="eyebrow">RPS</span></div><div class="source-row"><div class="source-label"><span class="purple">✈</span> Air transport</div><div class="source-value">${fmt(air)}</div><div class="source-value purple">${fmt(air)}/s</div></div><div class="source-row"><div class="source-label"><span class="gold">♧</span> Sea transport</div><div class="source-value">${fmt(boats)}</div><div class="source-value gold">${fmt(boats)}/s</div></div><div class="source-row"><div class="source-label"><span class="green">♟</span> City managers</div><div class="source-value">${state.airports.filter(id=>airport(id).manager).length}</div><div class="source-value green">+18%/hub</div></div><div class="source-row"><div class="source-label"><span class="gold">♛</span> VIP lounges</div><div class="source-value">${lounge}</div><div class="source-value gold">+${lounge*8}% total</div></div></div><div class="card"><div class="card-head"><div class="card-title">▥ REVENUE HISTORY</div><span class="eyebrow">LAST 12 TICKS</span></div><div class="chart">${bars}</div><div class="help-text" style="margin-top:22px">Grafik menampilkan pendapatan per interval permainan. Data disimpan otomatis di perangkat ini.</div></div><div class="card"><div class="stat-grid"><div class="stat-box"><div class="stat-label">Lifetime revenue</div><div class="stat-value green">${short(state.totalEarned)}</div></div><div class="stat-box"><div class="stat-label">Passengers</div><div class="stat-value">${state.totalPassengers.toLocaleString('en-US')}</div></div><div class="stat-box"><div class="stat-label">Active routes</div><div class="stat-value">${allVehicles().filter(v=>v.from&&v.to).length}</div></div></div></div>`}
function renderAdvance(){const need=state.companyLevel*1500;const progress=Math.min(100,state.companyXp/need*100);return `<div class="card advance-card"><div class="advance-emblem">🏆</div><div class="advance-title">COMPANY EXPANSION</div><div class="advance-copy">Kembangkan reputasi perusahaan untuk membuka bonus permanen dan memperluas kerajaan transportasi.</div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Company level</div><div class="stat-value gold">${state.companyLevel}</div></div><div class="stat-box"><div class="stat-label">Income boost</div><div class="stat-value green">x${state.companyBoost.toFixed(2)}</div></div><div class="stat-box"><div class="stat-label">Lifetime</div><div class="stat-value">${short(state.totalEarned)}</div></div></div><div class="progress-track"><i style="width:${progress}%"></i></div><div class="help-text">EXP ${Math.floor(state.companyXp).toLocaleString('en-US')} / ${need.toLocaleString('en-US')} · Level berikutnya memberi bonus pendapatan 5%.</div><button class="upgrade-button btn-gold" style="width:100%;margin-top:14px" data-action="company-up" ${state.companyXp<need?'disabled':''}>${state.companyXp<need?'COLLECT MORE EXP':'UPGRADE COMPANY · FREE'}</button></div><div class="card"><div class="card-title">📊 CEO CAREER</div><div class="card-sub" style="margin:7px 0 12px">Total XP CEO: ${Math.floor(state.ceoXp).toLocaleString('en-US')}</div><div class="progress-track"><i style="width:${(state.ceoXp%3500)/3500*100}%"></i></div><div class="help-text">Setiap pendapatan dan ekspansi menambah pengalaman CEO. Level CEO menjadi catatan perkembangan karier manajemenmu.</div></div>`}
function renderCity(){const id=state.selectedCity,c=city(id),a=airport(id);if(!c)return '';const isOpen=state.airports.includes(id);let html=`<div class="city-detail-head"><div><div class="city-name">${c.name}</div><div class="city-kicker">${isOpen?'ACTIVE TRANSPORT HUB':'LOCKED CITY'} · ${c.region.toUpperCase()}</div><div class="city-mini-stats">👥 ${c.pop} passenger demand · ${isOpen?'Bandara aktif':'Harga buka '+fmt(c.price)}</div></div><button class="close-city" data-action="close-city">×</button></div>`;if(!isOpen){html+=`<div class="card"><div class="empty-state"><div class="empty-icon">🔒</div>Kota ini belum masuk jaringan perusahaan. Buka kota untuk mulai mengelola bandara dan membuat koneksi transportasi.</div><button class="upgrade-button btn-gold" data-action="unlock" data-id="${id}" style="width:100%;margin-top:10px" ${state.cash<c.price?'disabled':''}>UNLOCK CITY · ${fmt(c.price)}</button></div>`;return html}
html+=`<div class="stat-grid" style="margin-bottom:11px"><div class="stat-box"><div class="stat-label">Terminal</div><div class="stat-value">${a.capacity}/${c.pop}</div></div><div class="stat-box"><div class="stat-label">Arrivals</div><div class="stat-value">${a.arrivals.toFixed(1)}x</div></div><div class="stat-box"><div class="stat-label">Revenue boost</div><div class="stat-value green">${((a.manager?18:0)+a.lounge*8)}%</div></div></div><div class="inner-tabs"><button class="inner-tab ${state.cityTab==='planes'?'active':''}" data-citytab="planes">✈ PLANES</button><button class="inner-tab ${state.cityTab==='city'?'active':''}" data-citytab="city">▰ CITY</button><button class="inner-tab ${state.cityTab==='managers'?'active':''}" data-citytab="managers">♟ MANAGERS</button><button class="inner-tab ${state.cityTab==='lounges'?'active':''}" data-citytab="lounges">♛ LOUNGES</button></div>`;
if(state.cityTab==='planes'){let assigned=state.planes.filter(v=>v.from===id||v.to===id);html+=`<div class="section-heading"><h2>PASSENGER DEMAND</h2><span class="eyebrow">SHOW ON MAP ✓</span></div><div class="card"><div class="card-head"><div class="card-title">Destination opportunities</div><span class="owned-tag">${c.pop} DEMAND</span></div>`;const destinations=state.airports.filter(x=>x!==id).map(x=>({id:x,people:Math.max(8,Math.round((c.pop+city(x).pop)/4))}));if(!destinations.length)html+=`<div class="empty-state">Aktifkan kota lain untuk membuka pilihan destinasi.</div>`;destinations.forEach(d=>{const vehicle=state.planes.find(v=>(v.from===id&&v.to===d.id)||(v.from===d.id&&v.to===id));const price=vehicle?Math.round(vehicle.capacity*vehicle.ticket*1.6):Math.round((c.pop+city(d.id).pop)*11);html+=`<div class="destination-row"><div><div class="destination-name">${city(d.id).name}</div><div class="destination-sub">${d.people} calon penumpang · ${vehicle?'Rute aktif':'Koneksi tersedia'}</div></div><div class="destination-right"><span class="fare-pill">${fmt(price)}</span><button class="small-action" data-action="city-route" data-from="${id}" data-to="${d.id}">${vehicle?'VIEW':'CONNECT'}</button></div></div>`});html+=`</div><div class="card"><div class="card-head"><div class="card-title">✈ Assigned aircraft</div><span class="eyebrow">${assigned.length} PLANES</span></div>`;if(assigned.length)assigned.forEach(v=>html+=`<div class="destination-row"><div><div class="destination-name">${v.name}</div><div class="destination-sub">${city(v.from).name} → ${city(v.to).name}</div></div><span class="owned-tag">${fmt(routeIncome({...v,type:'air'}))}/s</span></div>`);else html+=`<div class="help-text" style="margin-top:9px">Belum ada pesawat yang terhubung ke kota ini.</div>`;html+=`</div>`}
if(state.cityTab==='city'){html+=`<div class="card"><div class="card-title">▰ AIRPORT DEVELOPMENT</div><div class="card-sub" style="margin:6px 0 12px">Upgrade fasilitas untuk memperbesar kapasitas kota.</div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Capacity</div><div class="stat-value">${a.capacity}</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="capacity">+5 · ${fmt(616+(a.capacity-50)*18)}</button></div><div class="stat-box"><div class="stat-label">Arrivals</div><div class="stat-value">${a.arrivals.toFixed(1)}x</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="arrivals">+0.1x · ${fmt(616+(a.arrivals-1)*900)}</button></div><div class="stat-box"><div class="stat-label">Ticket price</div><div class="stat-value">${a.ticket.toFixed(1)}x</div><button class="upgrade-button" style="width:100%;margin-top:8px" data-action="airport-up" data-id="${id}" data-key="ticket">+0.1x · ${fmt(734+(a.ticket-1)*900)}</button></div></div></div>`}
if(state.cityTab==='managers'){html+=`<div class="card"><div class="card-title">♟ CITY MANAGER</div><div class="card-sub" style="margin:6px 0 12px">${a.manager?'Manajer sudah aktif di '+c.name+'.':'Rekrut manajer untuk meningkatkan pemasukan rute dari kota ini.'}</div><button class="upgrade-button" data-action="hire" data-id="${id}" style="width:100%" ${a.manager||state.cash<10200?'disabled':''}>${a.manager?'MANAGER HIRED':'HIRE MANAGER · $10.2K'}</button></div>`}
if(state.cityTab==='lounges'){const cost=2800*(a.lounge+1);html+=`<div class="card"><div class="card-title">♛ VIP LOUNGE</div><div class="card-sub" style="margin:6px 0 12px">Level ${a.lounge}/3 · Bonus pendapatan +${a.lounge*8}%</div><div class="progress-track"><i style="width:${a.lounge/3*100}%"></i></div><button class="upgrade-button btn-gold" data-action="lounge" data-id="${id}" style="width:100%" ${a.lounge>=3||state.cash<cost?'disabled':''}>${a.lounge>=3?'MAX LEVEL':'UPGRADE · '+fmt(cost)}</button></div>`}
return html}
function renderPanel(){const box=document.getElementById('panel-content');if(state.selectedCity){box.innerHTML=renderCity();return}if(state.mainTab==='revenue'){box.innerHTML=state.subTab==='advance'?renderAdvance():renderRevenue();return}if(state.subTab==='airports'){box.innerHTML=renderAirports();return}if(state.subTab==='managers'){box.innerHTML=renderManagers();return}if(state.subTab==='lounges'){box.innerHTML=renderLounges();return}box.innerHTML=renderFleet(state.mainTab==='boats'?'boat':'air')}
function tabsRender(){document.querySelectorAll('.main-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.mainTab));const nav=document.getElementById('sub-tabs');const items=state.mainTab==='revenue'?[['analytics','▤','ANALYTICS'],['advance','☆','ADVANCE']]:[['fleet',state.mainTab==='air'?'✈':'♧','FLEET'],['airports','▰','AIRPORTS'],['managers','♟','MANAGERS'],['lounges','♛','LOUNGES']];nav.innerHTML=items.map(([id,ico,label])=>`<button class="sub-tab ${state.subTab===id?'active':''}" data-sub="${id}"><span class="tab-ico">${ico}</span>${label}</button>`).join('')}
function renderCities(){const layer=document.getElementById('cities-layer');layer.innerHTML=CITY_DATA.map(c=>{const unlocked=state.airports.includes(c.id),selected=state.selectedCity===c.id;const labelY=c.y-16;return `<g class="city-group ${unlocked?'':'locked'} ${selected?'selected':''}" data-city="${c.id}" role="button" tabindex="0"><circle cx="${c.x}" cy="${c.y}" r="${unlocked?7:6}" class="${unlocked?'city-dot':'city-locked'}"/><text x="${c.x+10}" y="${labelY}" class="city-label">${c.name}</text><text x="${c.x+10}" y="${c.y+19}" class="city-count">${unlocked?('● '+c.pop+'/50'):'⌑ LOCKED · '+short(c.price)}</text></g>`}).join('')}
function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=b.x-a.x,dy=b.y-a.y;const len=Math.hypot(dx,dy)||1;const bend=Math.min(80,Math.max(22,len*.16));const cx=mx-dy/len*bend,cy=my+dx/len*bend;return {d:`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`,cx,cy}}
function renderRoutes(){const routes=document.getElementById('routes-layer'),vehicles=document.getElementById('vehicles-layer');const list=allVehicles().filter(v=>v.from&&v.to);routes.innerHTML=list.map(v=>{const c=curve(city(v.from),city(v.to));return `<path d="${c.d}" class="route-line ${v.type==='boat'?'route-boat':'route-plane'}"/>`}).join('');vehicles.innerHTML=list.map(v=>`<g id="vehicle-${v.type}-${v.id}" class="vehicle"><text class="${v.type==='boat'?'vehicle-boat':'vehicle-plane'}" text-anchor="middle">${v.type==='boat'?'♧':'✈'}</text></g>`).join('');routes.style.opacity=state.routesVisible?'1':'.05';vehicles.style.opacity=state.routesVisible?'1':'.05';updateVehicles()}
function updateVehicles(){allVehicles().filter(v=>v.from&&v.to).forEach(v=>{const el=document.getElementById(`vehicle-${v.type}-${v.id}`);if(!el)return;const a=city(v.from),b=city(v.to),p=(v.progress%1),{cx,cy}=curve(a,b);const t=1-p,x=(1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x,y=(1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y;el.setAttribute('transform',`translate(${x} ${y})`);})}
function updateHud(){document.getElementById('cash').textContent=Math.floor(state.cash).toLocaleString('en-US');document.getElementById('plane-count').textContent=state.planes.length+'/10';document.getElementById('boat-count').textContent=state.boats.length+'/5';document.getElementById('passenger-count').textContent=state.passengers.toLocaleString('en-US');document.getElementById('income-rate').textContent='+'+fmt(income())+'/s';document.getElementById('ceo-level').textContent=state.ceoLevel;document.getElementById('company-level').textContent=state.companyLevel;document.getElementById('ceo-progress').style.width=((state.ceoXp%3500)/3500*100)+'%';document.getElementById('company-progress').style.width=(Math.min(100,state.companyXp/(state.companyLevel*1500)*100))+'%'}
function renderAll(){tabsRender();renderPanel();renderCities();renderRoutes();updateHud();save()}
function tick(){const rate=income();earn(rate);state.planes.forEach(v=>{if(v.from&&v.to){const dist=Math.hypot(city(v.from).x-city(v.to).x,city(v.from).y-city(v.to).y);v.progress=(v.progress+v.speed/Math.max(500,dist*1.2))%1}});state.boats.forEach(v=>{if(v.from&&v.to){const dist=Math.hypot(city(v.from).x-city(v.to).x,city(v.from).y-city(v.to).y);v.progress=(v.progress+v.speed/Math.max(900,dist*2.4))%1}});if(Math.floor(Date.now()/5000)!==tick.lastPassenger){tick.lastPassenger=Math.floor(Date.now()/5000);const active=allVehicles().filter(v=>v.from&&v.to);const carried=active.reduce((s,v)=>s+Math.max(1,Math.round(v.capacity*.12)),0);state.passengers+=carried;state.totalPassengers+=carried;}if(Math.floor(Date.now()/10000)!==tick.lastHistory){tick.lastHistory=Math.floor(Date.now()/10000);state.history.push(rate);if(state.history.length>12)state.history.shift()}updateLevels();updateHud();updateVehicles();save()}
tick.lastPassenger=Math.floor(Date.now()/5000);tick.lastHistory=Math.floor(Date.now()/10000);
// Event delegation for all interface controls.
document.getElementById('main-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setMain(b.dataset.tab)});
document.getElementById('sub-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-sub]');if(b)setSub(b.dataset.sub)});
document.getElementById('panel-content').addEventListener('click',e=>{const cityTab=e.target.closest('[data-citytab]');if(cityTab){state.cityTab=cityTab.dataset.citytab;renderPanel();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,key=b.dataset.key;switch(a){case'buy-air':buyPlane(+b.dataset.index);break;case'buy-boat':buyBoat(+b.dataset.index);break;case'upgrade':buyUpgrade(b.dataset.type,+id,key);break;case'unlock':unlockCity(id);break;case'airport-up':upgradeAirport(id,key);break;case'hire':hireManager(id);break;case'lounge':buyLounge(id);break;case'assign':{const from=document.getElementById(`from-${b.dataset.type}-${id}`).value,to=document.getElementById(`to-${b.dataset.type}-${id}`).value;assignRoute(b.dataset.type,+id,from,to);break}case'close-city':state.selectedCity=null;renderAll();break;case'city-route':{const free=state.planes.find(v=>!v.from||!v.to);if(free){assignRoute('air',free.id,b.dataset.from,b.dataset.to)}else{state.mainTab='air';state.subTab='fleet';state.selectedCity=null;renderAll();toast('Semua pesawat sudah memiliki rute. Beli pesawat baru atau ubah rute armada.')}break}case'company-up':{const need=state.companyLevel*1500;if(state.companyXp>=need){state.companyXp-=need;state.companyLevel++;state.companyBoost+=.05;toast('Perusahaan naik level! Bonus pendapatan permanen +5%.');renderAll()}break}}});
document.getElementById('world-map').addEventListener('click',e=>{const g=e.target.closest('[data-city]');if(g)openCity(g.dataset.city)});
document.getElementById('world-map').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-city]'))openCity(e.target.dataset.city)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.closest('#panel-content'))return;switch(b.dataset.action){case'bonus':takeBonus();break;case'settings':settings();break;case'help':help();break;case'mapview':state.routesVisible=!state.routesVisible;document.getElementById('routes-layer').style.opacity=state.routesVisible?'1':'.05';document.getElementById('vehicles-layer').style.opacity=state.routesVisible?'1':'.05';mapToast(state.routesVisible?'Rute ditampilkan':'Rute disembunyikan');break}});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});
load();renderAll();if(offlineGain>0){updateLevels();updateHud();toast('Selamat datang kembali! Penghasilan saat offline: '+fmt(offlineGain))}setInterval(tick,1000);
// Poki lifecycle integration. The game remains playable if the SDK is unavailable locally.
let pokiGameplayActive=false;
function pokiStart(){if(pokiGameplayActive)return;pokiGameplayActive=true;try{if(window.PokiSDK&&typeof PokiSDK.gameplayStart==='function')PokiSDK.gameplayStart()}catch(e){}}
function pokiStop(){if(!pokiGameplayActive)return;pokiGameplayActive=false;try{if(window.PokiSDK&&typeof PokiSDK.gameplayStop==='function')PokiSDK.gameplayStop()}catch(e){}}
try{if(window.PokiSDK&&typeof PokiSDK.init==='function'){PokiSDK.init().then(()=>{try{PokiSDK.gameLoadingFinished()}catch(e){}}).catch(()=>{});}else{/* Local preview: no Poki SDK */}}catch(e){}
window.addEventListener('pointerdown',pokiStart,{once:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){save();pokiStop()}});
window.addEventListener('pagehide',pokiStop);
// Prevent the embedded game from scrolling the host page with game-like keys/wheel input.
window.addEventListener('keydown',ev=>{if(['ArrowDown','ArrowUp',' '].includes(ev.key)&&!ev.target.closest('input,select,textarea'))ev.preventDefault()});
window.addEventListener('wheel',ev=>{if(!ev.target.closest('.panel-scroll'))ev.preventDefault()},{passive:false});
// Autosave immediately when the page is backgrounded or closed.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
