plugins {
    id 'com.android.application'
}

android {
    namespace 'id.bulcreative.globalroutestycoon'
    compileSdk 36

    defaultConfig {
        applicationId 'id.bulcreative.globalroutestycoon'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
